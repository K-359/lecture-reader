<html><head><meta charset="utf-8"><style>
@page{size:1280px 720px;margin:0}body{margin:0;font-family:'Hiragino Sans';}
.s{width:1280px;height:720px;padding:50px 60px;box-sizing:border-box;page-break-after:always;position:relative}
h1{font-size:40px;border-bottom:4px solid #036;color:#036;margin:0 0 20px}p{font-size:22px;margin:8px 0}
svg text{font-family:'Hiragino Sans'}
</style></head><body>

<!-- 1: 折れ線グラフ（色で区別する凡例つき）と本文 -->
<div class="s"><h1>学習時間とテストの点数</h1>
<div style="display:flex;gap:40px;align-items:flex-start">
<div style="width:380px"><p>週あたりの学習時間が長いほど、点数は上がる。</p><p>ただし10時間を超えると伸びは小さくなる。</p><p style="font-size:16px;color:#555">出典：2025年度 受講者アンケート（n=120）</p></div>
<svg width="720" height="520" viewBox="0 0 720 520">
  <line x1="80" y1="440" x2="680" y2="440" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="440" x2="80" y2="40" stroke="#000" stroke-width="2"/>
  <g font-size="16" text-anchor="middle">
    <text x="80" y="465">0</text><text x="200" y="465">4</text><text x="320" y="465">8</text><text x="440" y="465">12</text><text x="560" y="465">16</text><text x="680" y="465">20</text>
  </g>
  <text x="380" y="500" font-size="18" text-anchor="middle">週あたりの学習時間（時間）</text>
  <g font-size="16" text-anchor="end">
    <text x="70" y="445">0</text><text x="70" y="345">25</text><text x="70" y="245">50</text><text x="70" y="145">75</text><text x="70" y="45">100</text>
  </g>
  <text x="24" y="240" font-size="18" text-anchor="middle" transform="rotate(-90 24 240)">点数</text>
  <polyline fill="none" stroke="#d00" stroke-width="4" points="80,380 200,280 320,190 440,140 560,125 680,118"/>
  <polyline fill="none" stroke="#080" stroke-width="4" points="80,400 200,330 320,270 440,235 560,222 680,215"/>
  <rect x="470" y="300" width="190" height="80" fill="#fff" stroke="#999"/>
  <line x1="485" y1="325" x2="525" y2="325" stroke="#d00" stroke-width="4"/><text x="535" y="331" font-size="16">対面授業</text>
  <line x1="485" y1="358" x2="525" y2="358" stroke="#080" stroke-width="4"/><text x="535" y="364" font-size="16">オンライン授業</text>
</svg></div></div>

<!-- 2: 流れの図 -->
<div class="s"><h1>通信システムのしくみ</h1>
<p>シャノンの通信モデルでは、送りたい情報は次の順に伝わる。</p>
<svg width="1160" height="420" viewBox="0 0 1160 420">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#000"/></marker></defs>
  <g font-size="24" text-anchor="middle">
    <rect x="10" y="120" width="180" height="90" rx="10" fill="#dde8ff" stroke="#036" stroke-width="3"/><text x="100" y="175">情報源</text>
    <rect x="250" y="120" width="180" height="90" rx="10" fill="#dde8ff" stroke="#036" stroke-width="3"/><text x="340" y="175">送信機</text>
    <rect x="490" y="120" width="180" height="90" rx="10" fill="#fff3c4" stroke="#036" stroke-width="3"/><text x="580" y="175">通信路</text>
    <rect x="730" y="120" width="180" height="90" rx="10" fill="#dde8ff" stroke="#036" stroke-width="3"/><text x="820" y="175">受信機</text>
    <rect x="970" y="120" width="180" height="90" rx="10" fill="#dde8ff" stroke="#036" stroke-width="3"/><text x="1060" y="175">受信者</text>
    <rect x="490" y="310" width="180" height="80" rx="10" fill="#ffd6d6" stroke="#900" stroke-width="3"/><text x="580" y="360">雑音源</text>
  </g>
  <g stroke="#000" stroke-width="3" marker-end="url(#a)">
    <line x1="190" y1="165" x2="246" y2="165"/><line x1="430" y1="165" x2="486" y2="165"/>
    <line x1="670" y1="165" x2="726" y2="165"/><line x1="910" y1="165" x2="966" y2="165"/>
    <line x1="580" y1="310" x2="580" y2="214"/>
  </g>
  <g font-size="18" text-anchor="middle" fill="#333">
    <text x="218" y="105">メッセージ</text><text x="458" y="105">信号</text><text x="698" y="105">受信信号</text><text x="938" y="105">メッセージ</text>
  </g>
</svg></div>

</body></html>
