<div class="s"><h1>第3回 情報理論入門：エントロピー</h1><ul>
<li>情報量は確率の対数で表される：I(x) = −log₂ p(x)</li>
<li>エントロピーは情報量の期待値である</li>
<li>一様分布のときにエントロピーは最大になる</li></ul>
<p>参考文献：Shannon, C. E. (1948). A Mathematical Theory of Communication.</p></div>
